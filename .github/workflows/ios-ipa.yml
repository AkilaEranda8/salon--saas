name: iOS IPA (macOS)

# Build Hexaone staff app IPA on GitHub-hosted macOS.
#
# Manual run: Actions → "iOS IPA (macOS)" → Run workflow
#
# Required repo Secrets for a signed, installable IPA:
#   IOS_DIST_CERT_P12_BASE64   — base64 of .p12 distribution certificate
#   IOS_DIST_CERT_PASSWORD     — password for that .p12
#   IOS_PROVISION_PROFILE_BASE64 — base64 of .mobileprovision
#   IOS_TEAM_ID                — Apple Developer Team ID (yours: 6J94NRH5M6)
# Optional:
#   IOS_BUNDLE_ID              — override (default: com.hexaone.staff)
#   IOS_KEYCHAIN_PASSWORD      — keychain password (random OK)
#
# Encode files (Mac/Linux):
#   base64 -i Certificates.p12 | pbcopy
#   base64 -i profile.mobileprovision | pbcopy
#
# Without signing secrets the job still compiles iOS (--no-codesign) and
# uploads the .app as a CI artifact (not installable on devices).

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Marketing version (CFBundleShortVersionString), e.g. 1.3.3'
        required: false
        default: ''
      build_number:
        description: 'Build number (CFBundleVersion), e.g. 8 — blank = pubspec + run_id'
        required: false
        default: ''
      export_method:
        description: 'IPA export method'
        required: true
        default: ad-hoc
        type: choice
        options:
          - ad-hoc
          - app-store
          - development
          - enterprise
  push:
    branches: [main]
    paths:
      - 'staff_mobile_app/**'
      - '.github/workflows/ios-ipa.yml'

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: staff_mobile_app

jobs:
  build-ipa:
    name: Build IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve build name / number
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC_VER=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')
          PUB_NAME="${PUBSPEC_VER%%+*}"
          PUB_NUM="${PUBSPEC_VER##*+}"
          NAME="${{ github.event.inputs.build_name }}"
          NUM="${{ github.event.inputs.build_number }}"
          if [ -z "$NAME" ]; then NAME="$PUB_NAME"; fi
          if [ -z "$NUM" ]; then NUM="${PUB_NUM}.${{ github.run_number }}"; fi
          echo "build_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$NUM" >> "$GITHUB_OUTPUT"
          echo "Using $NAME+$NUM"

      - name: Install dependencies
        run: flutter pub get

      - name: Check signing secrets
        id: sign
        shell: bash
        run: |
          if [ -n "${{ secrets.IOS_DIST_CERT_P12_BASE64 }}" ] && \
             [ -n "${{ secrets.IOS_DIST_CERT_PASSWORD }}" ] && \
             [ -n "${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}" ] && \
             [ -n "${{ secrets.IOS_TEAM_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets present — will produce IPA"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing iOS signing secrets. Building with --no-codesign (not installable)."
          fi

      - name: Install Apple certificate & profile
        if: steps.sign.outputs.enabled == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KC_PASS="${KEYCHAIN_PASSWORD:-github-actions-temp}"

          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "Installed provisioning profile $PROFILE_UUID"

      - name: Apply bundle id / team (signed builds)
        if: steps.sign.outputs.enabled == 'true'
        env:
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          BID="${BUNDLE_ID:-com.hexaone.staff}"
          export BID TEAM_ID
          python3 <<'PY'
          from pathlib import Path
          import os, re
          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          team = os.environ["TEAM_ID"]
          bid = os.environ["BID"]
          text = path.read_text()
          text = text.replace(
              "PRODUCT_BUNDLE_IDENTIFIER = com.example.staffMobileApp;",
              f"PRODUCT_BUNDLE_IDENTIFIER = {bid};",
          )
          text = re.sub(r"\n\t+DEVELOPMENT_TEAM = [^;]+;", "", text)
          text = text.replace(
              f"PRODUCT_BUNDLE_IDENTIFIER = {bid};",
              f"PRODUCT_BUNDLE_IDENTIFIER = {bid};\n\t\t\t\tDEVELOPMENT_TEAM = {team};",
          )
          path.write_text(text)
          print(f"Bundle ID → {bid}, Team → {team}")
          PY
          echo "BID=$BID" >> "$GITHUB_ENV"

      - name: Write ExportOptions.plist
        if: steps.sign.outputs.enabled == 'true'
        env:
          EXPORT_METHOD: ${{ github.event.inputs.export_method || 'ad-hoc' }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          BID="${BID:-com.hexaone.staff}"
          METHOD="${EXPORT_METHOD:-ad-hoc}"
          python3 - <<PY
          from pathlib import Path
          import os, textwrap
          bid = os.environ.get("BID", "com.hexaone.staff")
          method = os.environ.get("EXPORT_METHOD", "ad-hoc")
          team = os.environ["TEAM_ID"]
          uuid = os.environ["PROFILE_UUID"]
          content = textwrap.dedent(f"""\
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>{method}</string>
            <key>teamID</key>
            <string>{team}</string>
            <key>compileBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>{bid}</key>
              <string>{uuid}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <false/>
          </dict>
          </plist>
          """)
          Path("ios/ExportOptions.plist").write_text(content)
          print(f"Export method: {method}")
          PY

      - name: Build signed IPA
        if: steps.sign.outputs.enabled == 'true'
        run: |
          flutter build ipa \
            --release \
            --build-name="${{ steps.ver.outputs.build_name }}" \
            --build-number="${{ steps.ver.outputs.build_number }}" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Build unsigned iOS (CI compile check)
        if: steps.sign.outputs.enabled != 'true'
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name="${{ steps.ver.outputs.build_name }}" \
            --build-number="${{ steps.ver.outputs.build_number }}"
          mkdir -p build/ios/ci_unsigned
          cp -R build/ios/iphoneos/Runner.app build/ios/ci_unsigned/
          (cd build/ios/ci_unsigned && zip -r ../Runner-unsigned.app.zip Runner.app)

      - name: Upload IPA
        if: steps.sign.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Hexaone-iOS-${{ steps.ver.outputs.build_name }}-${{ steps.ver.outputs.build_number }}
          path: |
            staff_mobile_app/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned app zip
        if: steps.sign.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Hexaone-iOS-unsigned-${{ steps.ver.outputs.build_name }}-${{ steps.ver.outputs.build_number }}
          path: staff_mobile_app/build/ios/Runner-unsigned.app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup keychain
        if: always() && steps.sign.outputs.enabled == 'true'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
