<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hexa-salon-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hexaone — Smart Salon Management System by Hexalyte Innovation" />
    <title>Hexaone — Smart Salon Management</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('salon-theme-mode');
          if (mode === 'dark' || mode === 'light') {
            document.documentElement.setAttribute('data-theme', mode);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
