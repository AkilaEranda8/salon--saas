services:
  # ── Nginx Reverse Proxy (handles subdomain routing) ──────────────────────
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - phpmyadmin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro

  certbot:
    image: certbot/dns-cloudflare
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
      - /root/cloudflare-credentials.ini:/etc/cloudflare/credentials.ini:ro
    profiles:
      - certbot

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-hexasalon}
    # Do NOT expose MySQL port to the host in production
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - redis_data:/data
      - ./redis/entrypoint.sh:/entrypoint.sh:ro
      - ./redis/users.acl.template:/etc/redis/users.acl.template:ro
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "salon_app", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_USER: root
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: 5000
      # C15: app user covers cache + queues
      REDIS_URL: redis://salon_app:${REDIS_PASSWORD}@redis:6379
      AI_ENGINE_URL: ${AI_ENGINE_URL:-http://ai_engine:8010}
      AI_ENGINE_SERVICE_SECRET: ${AI_ENGINE_SERVICE_SECRET:?AI_ENGINE_SERVICE_SECRET is required}
      AI_SECRETS_KEY: ${AI_SECRETS_KEY:?AI_SECRETS_KEY is required}
      AI_CRM_WORKERS: "false"
      CRM_DLQ_SLACK_WEBHOOK_URL: ${CRM_DLQ_SLACK_WEBHOOK_URL:-}
      CRM_DLQ_ALERT_EMAIL: ${CRM_DLQ_ALERT_EMAIL:-}
      CRM_DLQ_ALERT_WEBHOOK_URL: ${CRM_DLQ_ALERT_WEBHOOK_URL:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      # Stripe billing (optional — billing features disabled if not set)
      STRIPE_SECRET_KEY:          ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET:      ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_BASIC_PRICE_ID:      ${STRIPE_BASIC_PRICE_ID:-}
      STRIPE_PRO_PRICE_ID:        ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_ENTERPRISE_PRICE_ID: ${STRIPE_ENTERPRISE_PRICE_ID:-}
      # Email notifications (optional)
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      # Twilio SMS (optional)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN:  ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      FRONTEND_BASE_URL:  ${FRONTEND_BASE_URL:-https://{slug}.salon.hexalyte.com}
      PLATFORM_URL:       ${PLATFORM_URL:-https://admin.hexalyte.com}
      SERVER_IP:          ${SERVER_IP:-}
      # Keycloak (optional — leave blank to fall back to legacy JWT)
      KEYCLOAK_URL:         ${KEYCLOAK_URL:-}
      KC_CLIENT_ID:         ${KC_CLIENT_ID:-salon-backend}
      KC_CLIENT_SECRET:     ${KC_CLIENT_SECRET:-}
      KEYCLOAK_AUTH_ENABLED: ${KEYCLOAK_AUTH_ENABLED:-false}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    expose:
      - "5000"
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_KEYCLOAK: ${VITE_USE_KEYCLOAK:-false}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-https://auth.hexalyte.com}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  website:
    build: ./website
    restart: unless-stopped
    expose:
      - "80"

  aibot:
    build: ./ai_bot
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SALON_API_URL: http://backend:5000/api
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    expose:
      - "8000"

  # New WhatsApp AI CRM engine — does NOT replace ai_bot
  ai_engine:
    build: ./ai_engine
    restart: unless-stopped
    depends_on:
      - backend
      - redis
    environment:
      SALON_API_URL: http://backend:5000/api
      AI_ENGINE_SERVICE_SECRET: ${AI_ENGINE_SERVICE_SECRET:?AI_ENGINE_SERVICE_SECRET is required}
      REDIS_URL: redis://salon_session:${REDIS_PASSWORD}@redis:6379
      NODE_ENV: production
      PORT: 8010
    expose:
      - "8010"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8010/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Dedicated AI CRM workers (C15) — must not run inside API process
  ai_crm_worker:
    build: ./backend
    restart: unless-stopped
    command: ["node", "workers/aiCrmWorker.js"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      ai_engine:
        condition: service_started
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_USER: root
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REDIS_URL: redis://salon_app:${REDIS_PASSWORD}@redis:6379
      AI_ENGINE_URL: http://ai_engine:8010
      AI_ENGINE_SERVICE_SECRET: ${AI_ENGINE_SERVICE_SECRET:?AI_ENGINE_SERVICE_SECRET is required}
      AI_SECRETS_KEY: ${AI_SECRETS_KEY:?AI_SECRETS_KEY is required}
      AI_CRM_WORKERS: "true"
      CRM_DLQ_SLACK_WEBHOOK_URL: ${CRM_DLQ_SLACK_WEBHOOK_URL:-}
      CRM_DLQ_ALERT_EMAIL: ${CRM_DLQ_ALERT_EMAIL:-}
      CRM_DLQ_ALERT_WEBHOOK_URL: ${CRM_DLQ_ALERT_WEBHOOK_URL:-}

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASS:?DB_PASS is required}
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 64M
    expose:
      - "80"
    # NOTE: phpMyAdmin is only reachable via pma.hexalyte.com through nginx.
    # Access is controlled by nginx IP restrictions in proxy/default.conf.
    # Never expose port 80 directly on the host in production.

  # One-off seed runner
  seed:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_USER: root
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://{slug}.salon.hexalyte.com}
      PLATFORM_URL:      ${PLATFORM_URL:-https://admin.hexalyte.com}
    command: node scripts/seedAll.js
    profiles:
      - seed

volumes:
  mysql_data:
    external: true
    name: salon_v1_mysql_data
  uploads_data:
    external: true
    name: salon_v1_uploads_data
  redis_data:
    name: salon_v1_redis_data
  certbot_www:
    external: true
    name: salon_v1_certbot_www
  certbot_conf:
    external: true
    name: salon_v1_certbot_conf
